# Last Christmas (Wham!), for the Christmas pack. Format: docs/SHOW_FILES.md.
# Bars count from the section's start; the song is one bar per cycle at 92 BPM.
# The closer: good night from the ops room. Home is the SAT FEED (snowfall) on
# evergreen; the morale feed cuts in for the one big chorus, the lift goes amber.
# Stations keep a still camera so the console stays in frame.

[show]
title = "Last Christmas"
out = "../renders/last-christmas.mp4"
size = "1920x1080"
fps = 60

[defaults]
code = "hide"
titles = false
camera = { move = "still", punch = 0, kick = 0.4 }
palette = "norad"
grain = 0.12

[[song]]
source = "../songs/04-last-christmas.strudel"
mode = "snowfall"
palette = "evergreen"
fade = { in = 1, out = 3 }

# 0–8 · pad, sub and a pluck. The village under the reticle, then the name.
[song.sections.intro]
mode = "snowfall"
text = [
  { say = "> STN-04 SAT FEED · PASS 07", at = 0, hold = 1.5, place = "top" },
  { say = "WHAM!", at = 1.5, hold = 1.6, style = "card" },
  { say = "LAST CHRISTMAS", at = 4, hold = 2.4, style = "card" },
]

# 8–16 · slow 808, pulsing bass, the verse on epiano. Still the feed.
[song.sections.verse]
mode = "snowfall"
transition = "fade"

# 16–20 · hats double, snare roll, klaxon. Amber, rising.
[song.sections.lift]
mode = "sleigh-road"
palette = "amber"
letterbox = 2.39
transition = "fade"
camera = { move = "push", punch = 0.5, kick = 0.5 }
text = [{ say = "> SLEIGHCON RISING · ALL STATIONS", at = 1, hold = 2, place = "top" }]

# 20–36 · the one big chorus, then the riff. The morale feed cuts in.
[song.sections.chorus]
shots = [
  { mode = "christmas-band", palette = "norad" },
  { mode = "snowglobe", palette = "norad" },
  { mode = "christmas-house", palette = "evergreen" },
  { mode = "snowfall", palette = "evergreen" },
]
every = 4
transition = "flash"
camera = { move = "still", punch = 0, kick = 0.6 }
text = [
  { say = "> STN-03 MORALE FEED · LINK LOCKED", at = 0, hold = 1.5, place = "top" },
  { say = "LAST CHRISTMAS I GAVE YOU MY HEART", at = 2, hold = 2.5, place = "top" },
]

# 36–44 · second verse, the SAT FEED alone.
[song.sections.verse2]
mode = "snowfall"
transition = "fade"
text = [{ say = "> STN-04 SAT FEED · PASS 08", at = 0, hold = 1.5, place = "top" }]

# 44–52 · the chorus again on tubular bells and choir.
[song.sections.refrain]
shots = [{ mode = "snowfall" }, { mode = "snowglobe", palette = "norad" }]
every = 4
transition = "fade"

# 52–68 · drums out: strings, an arp, the riff on bells. A long, wide cutaway.
[song.sections.bridge]
shots = [
  { mode = "sleigh-road", bars = 8, palette = "ice" },
  { mode = "lissajous", bars = 8, palette = "ice" },
]
letterbox = 2.39
transition = "fade"
camera = { move = "drift", punch = 0, kick = 0 }
grain = 0.2

# 68–84 · pulse for four bars, then one bell. Everyone stands down.
[song.sections.outro]
mode = "snowfall"
transition = "fade"
text = [
  { say = "> ALL STATIONS HOLD · GOOD NIGHT", at = 0, hold = 2, place = "top" },
  { say = "MERRY CHRISTMAS", at = 10, hold = 3.5, style = "card" },
]
