# The probe: every mode of the pack for two bars each, small and with nothing
# on top, for `cycpack probe harvest`. Its frames hash to one digest, so a
# refactor that should change nothing can prove it.

[show]
title = "Harvest probe"
out = "../renders/probe.mp4"
size = "480x270"
fps = 8

[defaults]
code = "hide"
titles = false
camera = { move = "still", punch = 0, kick = 0 }
palette = "harvest"
grain = 0

[[song]]
source = "../../halloween/songs/bustin-neil-cicierega.strudel"
shots = ["parade", "cornfield", "harvest-moon"]
every = 2
