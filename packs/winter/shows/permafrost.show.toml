# Permafrost, for the winter pack. Format: docs/SHOW_FILES.md.
# The cave wakes up, the yeti takes the decks for the drops, the aurora for the thaw.

[show]
title = "Permafrost"
out = "../renders/permafrost.mp4"
size = "1920x1080"
fps = 60

[defaults]
code = { follow = "solo", size = 20 }
titles = false
camera = { move = "still", punch = 0, kick = 0.4 }
palette = "glacier"
grain = 0.1

[[song]]
source = "../songs/permafrost.strudel"
mode = "ice-cave"
fade = { in = 1, out = 3 }

# 0–16: wind, a lone kick, the hook on bells.
[song.sections.intro]
mode = "ice-cave"
camera = { move = "drift", punch = 0, kick = 0.6 }
text = [{ say = "PERMAFROST", at = 4, hold = 3, style = "card" }]

# 16–24: the riser, the kick doubling, the crush.
[song.sections.build]
mode = "ice-cave"
camera = { move = "push", punch = 1, kick = 1.2 }
text = [{ say = "> CORE TEMPERATURE FALLING", at = 1, hold = 2, place = "top" }]

# 24–40: first drop.
[song.sections.drop]
shots = [{ mode = "ice-cave", bars = 1 }, { mode = "yeti-dj", bars = 7 }, { mode = "ice-cave", bars = 2 }, { mode = "yeti-dj", bars = 6 }]
transition = { kind = "glitch", bars = 0.3 }
camera = { move = "shake", punch = 2, kick = 2.5 }

# 40–44: everything stutters, then the tape stops.
[song.sections.glitch]
mode = "yeti-dj"
transition = "glitch"
speed = 2
camera = { move = "shake", punch = 3, kick = 4 }
text = [{ say = "> SIGNAL LOST", at = 2, hold = 1.5, place = "top" }]

# 44–60: pad, triangle lead, rims. The thaw.
[song.sections.thaw]
shots = [{ mode = "aurora", bars = 4 }, { mode = "ice-cave", bars = 12 }]
transition = "fade"
speed = 0.7
camera = { move = "drift", punch = 0, kick = 0 }

# 60–68: everything climbs.
[song.sections.build2]
shots = [{ mode = "ice-cave", bars = 4 }, { mode = "yeti-dj", bars = 4 }]
transition = { kind = "glitch", bars = 0.15 }
camera = { move = "push", punch = 1.5, kick = 1.5 }
text = [{ say = "> REFREEZING", at = 6, hold = 2, place = "top" }]

# 68–84: the last drop, the hook bare, then the lead joins.
[song.sections.drop2]
shots = [{ mode = "yeti-dj", bars = 8 }, { mode = "ice-cave", bars = 4 }, { mode = "yeti-dj", bars = 4 }]
transition = { kind = "glitch", bars = 0.3 }
camera = { move = "shake", punch = 3, kick = 2 }
text = [{ say = "ABSOLUTE ZERO", at = 0, hold = 1, style = "card" }]

# 84–92: the lead an octave up, the bass doubles, and it all stutters to a stop.
[song.sections.peak]
mode = "yeti-dj"
transition = { kind = "glitch", bars = 0.4 }
strobe = { on = "snare", strength = 0.15 }
camera = { move = "shake", punch = 3, kick = 2 }

# 92–104: the kick thins, the bells crush away.
[song.sections.outro]
mode = "ice-cave"
transition = "fade"
camera = { move = "drift", punch = 0, kick = 0.5 }
text = [{ say = "> STATION IDLE", at = 6, hold = 3, place = "top" }]
