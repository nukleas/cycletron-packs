# The Winter EP, the four songs back to back. Format: docs/SHOW_FILES.md.
# The sections follow the per-song shows; keep them in step.

[show]
title = "Winter"
out = "../renders/winter-ep.mp4"
size = "1920x1080"
fps = 60

[defaults]
code = { follow = "solo", size = 20 }
titles = false
camera = { move = "still", punch = 0, kick = 0.4 }
palette = "glacier"
grain = 0.1

# 01 Permafrost, 150 BPM, 104 bars. F minor industrial: the cave wakes, the booth takes the drops, the aurora the thaw.

[[song]]
source = "../songs/permafrost.strudel"
mode = "ice-cave"
fade = { in = 1 }

[song.sections]
intro  = { mode = "ice-cave", camera = { move = "drift", punch = 0, kick = 0.6 }, text = [{ say = "01 · PERMAFROST", at = 1, hold = 2.4, style = "card" }] }
build  = { mode = "ice-cave", camera = { move = "push", punch = 1, kick = 1.2 }, text = [{ say = "> CORE TEMPERATURE FALLING", at = 1, hold = 2, place = "top" }] }
drop   = { shots = [{ mode = "ice-cave", bars = 1 }, { mode = "yeti-dj", bars = 7 }, { mode = "ice-cave", bars = 2 }, { mode = "yeti-dj", bars = 6 }], transition = { kind = "glitch", bars = 0.3 }, camera = { move = "shake", punch = 2, kick = 2.5 } }
glitch = { mode = "yeti-dj", transition = "glitch", speed = 2, camera = { move = "shake", punch = 3, kick = 4 }, text = [{ say = "> SIGNAL LOST", at = 2, hold = 1.5, place = "top" }] }
thaw   = { shots = [{ mode = "aurora", bars = 4 }, { mode = "ice-cave", bars = 12 }], transition = "fade", speed = 0.7, camera = { move = "drift", punch = 0, kick = 0 } }
build2 = { shots = [{ mode = "ice-cave", bars = 4 }, { mode = "yeti-dj", bars = 4 }], transition = { kind = "glitch", bars = 0.15 }, camera = { move = "push", punch = 1.5, kick = 1.5 }, text = [{ say = "> REFREEZING", at = 6, hold = 2, place = "top" }] }
drop2  = { shots = [{ mode = "yeti-dj", bars = 8 }, { mode = "ice-cave", bars = 4 }, { mode = "yeti-dj", bars = 4 }], transition = { kind = "glitch", bars = 0.3 }, camera = { move = "shake", punch = 3, kick = 2 }, text = [{ say = "ABSOLUTE ZERO", at = 0, hold = 1, style = "card" }] }
peak   = { mode = "yeti-dj", transition = { kind = "glitch", bars = 0.4 }, strobe = { on = "snare", strength = 0.15 }, camera = { move = "shake", punch = 3, kick = 2 } }
outro  = { mode = "ice-cave", transition = "fade", camera = { move = "drift", punch = 0, kick = 0.5 }, text = [{ say = "> STATION IDLE", at = 6, hold = 3, place = "top" }] }

# 02 Rookery, 145 BPM, 112 bars. F minor acid hard groove: the booth opens, the warehouse takes the drops.

[[song]]
source = "../songs/rookery.strudel"
mode = "yeti-dj"

[song.sections]
intro   = { mode = "yeti-dj", text = [{ say = "02 · ROOKERY", at = 1, hold = 2.4, style = "card" }] }
build   = { shots = [{ mode = "yeti-dj", bars = 7 }, { mode = "yeti-dj", bars = 1, camera = { move = "shake", punch = 2.5, kick = 1.6 } }], transition = { kind = "glitch", bars = 0.3 }, camera = { move = "push", punch = 1, kick = 1.1 } }
drop    = { shots = [{ mode = "yeti-dj", bars = 0.25, camera = { move = "still", punch = 0, kick = 0.5 } }, { mode = "penguin-warehouse", bars = 7.75 }, { mode = "ice-cave", bars = 4 }, { mode = "penguin-warehouse", bars = 4 }], transition = { kind = "glitch", bars = 0.02 }, camera = { move = "shake", punch = 2, kick = 1.2 } }
groove  = { shots = [{ mode = "penguin-warehouse", bars = 12 }, { mode = "ice-cave", bars = 4 }], transition = { kind = "glitch", bars = 0.2 }, camera = { move = "shake", punch = 2, kick = 1.5 } }
break   = { mode = "ice-cave", transition = { kind = "fade", bars = 0.5 }, camera = { move = "still", punch = 0.3, kick = 0.2 }, text = [{ say = "> SEA ICE · HOLDING", at = 0.5, hold = 2, place = "top" }] }
build2  = { shots = [{ mode = "ice-cave", bars = 6 }, { mode = "yeti-dj", bars = 2, camera = { move = "shake", punch = 2, kick = 1.3 } }], transition = { kind = "glitch", bars = 0.4 }, camera = { move = "push", punch = 1.3, kick = 1.2 }, text = [{ say = "> WIND RISING", at = 1, hold = 2, place = "top" }] }
drop2   = { shots = [{ mode = "yeti-dj", bars = 0.25, camera = { move = "still", punch = 0, kick = 0.5 } }, { mode = "penguin-warehouse", bars = 15.75 }], transition = { kind = "glitch", bars = 0.02 }, camera = { move = "shake", punch = 2.2, kick = 1.3 } }
peak    = { shots = [{ mode = "penguin-warehouse", bars = 2 }, { mode = "ice-cave", bars = 2, camera = { move = "still", punch = 1, kick = 0.7 } }, { mode = "penguin-warehouse", bars = 6 }, { mode = "ice-cave", bars = 2, camera = { move = "still", punch = 1, kick = 0.7 } }], transition = { kind = "glitch", bars = 0.35 }, camera = { move = "shake", punch = 2.3, kick = 1.3 } }
reprise = { mode = "penguin-warehouse", transition = "glitch", camera = { move = "shake", punch = 2.5, kick = 1.6 } }
outro   = { shots = [{ mode = "yeti-dj", bars = 4 }, { mode = "aurora", bars = 4 }], transition = "black", camera = { move = "pull", punch = 0.4, kick = 0.5 }, text = [{ say = "> COLONY · AT REST", at = 5, hold = 1.5, place = "top" }] }

# 03 Crevasse, 140 BPM, 96 bars. A phrygian: the organ carries it. The code sits right, clear of the console.

[[song]]
source = "../songs/crevasse.strudel"
mode = "ice-organ"
code = { place = "right" }

[song.sections]
intro    = { mode = "ice-organ", camera = { move = "drift", punch = 0, kick = 0.3 }, text = [{ say = "03 · CREVASSE", at = 1, hold = 2.4, style = "card" }] }
build    = { shots = [{ mode = "ice-cave", bars = 4 }, { mode = "ice-organ", bars = 4 }], transition = { kind = "glitch", bars = 0.15 }, camera = { move = "push", punch = 1, kick = 1 }, text = [{ say = "> PROBE LOWERED", at = 1, hold = 2, place = "top" }] }
drop     = { shots = [{ mode = "ice-organ", bars = 8 }, { mode = "yeti-dj", bars = 4 }, { mode = "ice-organ", bars = 4 }], transition = { kind = "glitch", bars = 0.25 }, camera = { move = "shake", punch = 2, kick = 2 } }
break    = { shots = [{ mode = "aurora", bars = 4 }, { mode = "ice-organ", bars = 8 }], transition = "fade", camera = { move = "drift", punch = 0, kick = 0 }, text = [{ say = "> DEPTH 120 M", at = 1, hold = 2, place = "top" }] }
build2   = { mode = "ice-organ", transition = { kind = "glitch", bars = 0.15 }, camera = { move = "push", punch = 1.5, kick = 1.5 } }
drop2    = { shots = [{ mode = "ice-organ", bars = 8 }, { mode = "ice-cave", bars = 4 }, { mode = "ice-organ", bars = 4 }], transition = { kind = "glitch", bars = 0.3 }, camera = { move = "shake", punch = 2.4, kick = 2.2 } }
overload = { shots = [{ mode = "ice-organ", bars = 4 }, { mode = "yeti-dj", bars = 4 }, { mode = "ice-organ", bars = 8 }], transition = { kind = "glitch", bars = 0.3 }, strobe = { on = "snare", strength = 0.15 }, camera = { move = "shake", punch = 3, kick = 2.4 }, text = [{ say = "> PRESSURE CRITICAL", at = 0, hold = 1.5, place = "top" }] }
outro    = { shots = [{ mode = "ice-organ", bars = 8 }, { mode = "aurora", bars = 4 }], transition = "fade", camera = { move = "pull", punch = 0, kick = 0.3 }, text = [{ say = "> PROBE RECOVERED", at = 6, hold = 3, place = "top" }] }

# 04 Avalanche, 155 BPM, 112 bars. C minor schranz: the booth takes the drops, the cave answers.

[[song]]
source = "../songs/avalanche.strudel"
mode = "ice-cave"
fade = { out = 4 }

[song.sections]
intro  = { mode = "ice-cave", transition = "fade", camera = { move = "push", punch = 0, kick = 0.45 }, text = [{ say = "04 · AVALANCHE", at = 1, hold = 2.4, style = "card" }] }
build  = { mode = "ice-cave", transition = { kind = "glitch", bars = 0.12 }, camera = { move = "push", punch = 1.6, kick = 1.6 } }
drop   = { mode = "yeti-dj", transition = { kind = "glitch", bars = 0.18 }, camera = { move = "shake", punch = 2.6, kick = 2.4 }, text = [{ say = "> SLOPE RELEASE", at = 0.5, hold = 1.5, place = "top" }] }
dropb  = { mode = "ice-cave", transition = { kind = "glitch", bars = 0.14 }, camera = { move = "shake", punch = 2.2, kick = 2.2 } }
break  = { shots = [{ mode = "aurora", bars = 4 }, { mode = "ice-cave", bars = 12 }], grain = 0.25, transition = "fade", camera = { move = "drift", punch = 0, kick = 0 }, text = [{ say = "> WHITEOUT", at = 1, hold = 2, place = "top" }] }
build2 = { mode = "ice-cave", transition = { kind = "glitch", bars = 0.12 }, camera = { move = "push", punch = 1.8, kick = 2 } }
drop2  = { mode = "yeti-dj", transition = { kind = "glitch", bars = 0.16 }, strobe = { on = "snare", strength = 0.14 }, camera = { move = "shake", punch = 2.4, kick = 2 }, text = [{ say = "> SECOND RELEASE", at = 0.5, hold = 1.5, place = "top" }] }
drop2b = { shots = [{ mode = "yeti-dj", bars = 6 }, { mode = "ice-cave", bars = 2 }], transition = { kind = "glitch", bars = 0.1 }, strobe = { on = "snare", strength = 0.12 }, camera = { move = "shake", punch = 2.2, kick = 2 } }
outro  = { shots = [{ mode = "aurora", bars = 8 }, { mode = "ice-cave", bars = 8 }], transition = "fade", camera = { move = "pull", punch = 0, kick = 0.35 } }
