# Rookery, for the winter pack. Format: docs/SHOW_FILES.md.
# The booth opens it, the warehouse takes the drops, the cave the breaks.

[show]
title = "Rookery"
out = "../renders/rookery.mp4"
size = "1920x1080"
fps = 60

[defaults]
code = { follow = "solo", size = 20 }
titles = false
palette = "glacier"
camera = { move = "still", punch = 0.6, kick = 0.6 }
scanlines = false
grain = 0.05

[[song]]
source = "../songs/rookery.strudel"
mode = "yeti-dj"
fade = { in = 0.5, out = 2 }

[song.sections.intro]
mode = "yeti-dj"
text = [{ say = "ROOKERY", at = 1, hold = 2.4, style = "card" }]

[song.sections.build]
shots = [{ mode = "yeti-dj", bars = 7 }, { mode = "yeti-dj", bars = 1, camera = { move = "shake", punch = 2.5, kick = 1.6 } }]
transition = { kind = "glitch", bars = 0.3 }
camera = { move = "push", punch = 1, kick = 1.1 }

[song.sections.drop]
shots = [{ mode = "yeti-dj", bars = 0.25, camera = { move = "still", punch = 0, kick = 0.5 } }, { mode = "penguin-warehouse", bars = 7.75 }, { mode = "ice-cave", bars = 4 }, { mode = "penguin-warehouse", bars = 4 }]
transition = { kind = "glitch", bars = 0.02 }
camera = { move = "shake", punch = 2, kick = 1.2 }

[song.sections.groove]
shots = [{ mode = "penguin-warehouse", bars = 12 }, { mode = "ice-cave", bars = 4 }]
transition = { kind = "glitch", bars = 0.2 }
camera = { move = "shake", punch = 2, kick = 1.5 }

[song.sections.break]
mode = "ice-cave"
transition = { kind = "fade", bars = 0.5 }
camera = { move = "still", punch = 0.3, kick = 0.2 }
text = [{ say = "> SEA ICE · HOLDING", at = 0.5, hold = 2, place = "top" }]

[song.sections.build2]
shots = [{ mode = "ice-cave", bars = 6 }, { mode = "yeti-dj", bars = 2, camera = { move = "shake", punch = 2, kick = 1.3 } }]
transition = { kind = "glitch", bars = 0.4 }
camera = { move = "push", punch = 1.3, kick = 1.2 }
text = [{ say = "> WIND RISING", at = 1, hold = 2, place = "top" }]

[song.sections.drop2]
shots = [{ mode = "yeti-dj", bars = 0.25, camera = { move = "still", punch = 0, kick = 0.5 } }, { mode = "penguin-warehouse", bars = 15.75 }]
transition = { kind = "glitch", bars = 0.02 }
camera = { move = "shake", punch = 2.2, kick = 1.3 }

[song.sections.peak]
shots = [{ mode = "penguin-warehouse", bars = 2 }, { mode = "ice-cave", bars = 2, camera = { move = "still", punch = 1, kick = 0.7 } }, { mode = "penguin-warehouse", bars = 6 }, { mode = "ice-cave", bars = 2, camera = { move = "still", punch = 1, kick = 0.7 } }]
transition = { kind = "glitch", bars = 0.35 }
camera = { move = "shake", punch = 2.3, kick = 1.3 }

[song.sections.reprise]
mode = "penguin-warehouse"
transition = "glitch"
camera = { move = "shake", punch = 2.5, kick = 1.6 }

[song.sections.outro]
shots = [{ mode = "yeti-dj", bars = 4 }, { mode = "aurora", bars = 4 }]
transition = "black"
camera = { move = "pull", punch = 0.4, kick = 0.5 }
text = [{ say = "> COLONY · AT REST", at = 5, hold = 1.5, place = "top" }]
